# Entrega automática (CD): publica o site do mapa no GitHub Pages.
#
# É chamado pelo publicar.yml a cada versão publicada e também pode ser rodado à mão
# em Actions > Entrega automática (deploy) > Run workflow.
#
# De onde vêm os dados: a coleta roda no computador do responsável (src/coleta.py) e
# os totais (só agregados) vão como anexo "coleta.zip" de uma versão de dados, com o
# nome dados-AAAA-MM-DD. Esta entrega baixa o anexo da versão de dados mais recente,
# monta o site com o src/montar_site.py da versão publicada e o publica no Pages.
# Nenhum arquivo grande entra no código. Ver decisoes.md (issue #22).
#
# O Pages do repositório usa a origem "GitHub Actions" (Settings > Pages).

name: Entrega automática (deploy)

on:
  workflow_call:
    inputs:
      versao:
        description: "Versão a entregar (ex.: v2026.11.04)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a entregar (ex.: v2026.11.04)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Uma entrega de cada vez; a que está em andamento termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.versao }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Baixar os dados agregados (versão de dados mais recente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DADOS=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("dados-"))] | sort_by(.createdAt) | last | .tagName')
          if [ -z "$DADOS" ] || [ "$DADOS" = "null" ]; then
            echo "::error::Não há versão de dados (dados-AAAA-MM-DD) com o anexo coleta.zip."
            exit 1
          fi
          gh release download "$DADOS" --pattern coleta.zip --dir entrada
          unzip -q entrada/coleta.zip -d entrada
          echo "Dados: $DADOS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Montar o site
        run: python src/montar_site.py entrada --saida _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no Pages
        id: publicar
        uses: actions/deploy-pages@v4

      - name: Endereço
        env:
          VERSAO: ${{ inputs.versao }}
          URL: ${{ steps.publicar.outputs.page_url }}
        run: echo "Versão $VERSAO publicada em $URL" | tee -a "$GITHUB_STEP_SUMMARY"
