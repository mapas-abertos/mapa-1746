# Ponto de encaixe do CD (entrega contínua).
#
# Hoje não entrega nada: o destino de deploy está a definir (Checklist_Projeto.md).
# É chamado pelo publicar.yml a cada versão publicada e também pode ser rodado à mão
# em Actions > Entrega automática (deploy) > Run workflow.
#
# Quando o destino for escolhido:
# 1. troque o passo "Destino a definir" pelos passos de entrega do destino;
# 2. guarde as chaves do destino em Settings > Secrets and variables > Actions
#    e use como ${{ secrets.NOME_DA_CHAVE }} (ver docs/segredos_no_github.md);
# 3. registre a escolha em decisoes.md.
#
# Fica num arquivo separado porque uma versão criada pela própria rotina não dispara
# outra rotina sozinha; por isso o publicar.yml chama este arquivo diretamente.
# Destino que segue uma linha de trabalho (pyRevit, GitHub Pages): use a prod, que é a
# versão em uso, e não a main.

name: Entrega automática (deploy)

on:
  workflow_call:
    inputs:
      versao:
        description: "Versão a entregar (ex.: v2026.11.04)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a entregar (ex.: v2026.11.04)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.versao }}

      - name: Destino a definir
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          echo "Versão $VERSAO pronta. Destino de deploy a definir: nada foi entregue." | tee -a "$GITHUB_STEP_SUMMARY"
